<!DOCTYPE html>
<html lang="id" class="h-full w-full m-0 p-0 overflow-hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pemutar Musik</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Menghilangkan scrollbar bawaan agar UI bersih */
  ::-webkit-scrollbar {
    width: 0px;
    background: transparent;
  }
  
  /* Kustomisasi Input Range (Slider) untuk Progress Bar */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  input[type=range]:focus {
    outline: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: #e2e8f0;
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    height: 12px;
    width: 12px;
    border-radius: 50%;
    background: #2563eb;
    cursor: pointer;
    -webkit-appearance: none;
    margin-top: -4px;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active {
    transform: scale(1.3);
  }
</style>
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden flex flex-col bg-slate-50 font-sans text-slate-800 antialiased">

  <header class="shrink-0 bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center z-20 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded bg-blue-100 text-blue-600 flex items-center justify-center">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16"><path d="M11 1.05a1 1 0 0 1 1.276-.961l2.5.75A1 1 0 0 1 15.5 1.8v7.45a2.5 2.5 0 1 1-1-2V3.132l-3-.9V11.5a2.5 2.5 0 1 1-1-2V1.05z"/></svg>
      </div>
      <h1 class="font-bold text-[16px] text-slate-800">LokalPlay</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="clearAllBtn" class="p-2 text-slate-400 hover:text-red-500 rounded-full transition-colors" title="Kosongkan">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
      </button>
      <button id="importBtn" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold py-1.5 px-3 rounded-full flex items-center gap-1.5 transition-colors">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16"><path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z"/></svg>
        Tambah
      </button>
      <input id="fileInput" class="hidden" type="file" accept="audio/*" multiple>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto w-full p-2 relative bg-slate-50">
    <ul id="playlist" class="flex flex-col gap-1 pb-4">
      <!-- Item playlist akan dirender di sini via JS -->
    </ul>
    
    <!-- State Kosong -->
    <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-6 text-center pointer-events-none hidden">
      <svg class="w-16 h-16 mb-4 text-slate-300" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2.5a2.5 2.5 0 1 1 .6 1.59l2.47 2.47a.75.75 0 0 1-1.06 1.06l-2.47-2.47A2.5 2.5 0 0 1 11 2.5z"/><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0 1A5 5 0 1 0 8 3a5 5 0 0 0 0 10z"/></svg>
      <p class="font-medium text-sm text-slate-500">Belum ada musik.</p>
      <p class="text-xs mt-1">Ketuk tombol "Tambah" di atas untuk memasukkan file audio.</p>
    </div>
  </main>

  <footer class="shrink-0 bg-white border-t border-slate-200 z-20 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_10px_-4px_rgba(0,0,0,0.05)]">
    <!-- Progress / Seek Bar Penuh (Edge to Edge) -->
    <div class="w-full relative h-3 -mt-1.5 flex items-center justify-center px-0 group">
      <input id="seek" type="range" class="w-full h-full absolute z-10 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer mx-0" min="0" max="100" value="0" step="0.1">
      <!-- Visual Track -->
      <div class="w-full h-1 bg-slate-200 absolute top-1 pointer-events-none">
        <div id="progressFill" class="h-full bg-blue-600 w-0 pointer-events-none"></div>
      </div>
    </div>

    <div class="px-4 py-3 flex items-center justify-between gap-4">
      <!-- Info Lagu (Kiri) -->
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <div class="w-11 h-11 rounded-lg bg-blue-50 border border-blue-100 flex-shrink-0 flex items-center justify-center text-blue-500">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 16 16"><path d="M4 2.5A.5.5 0 0 1 4.757 2l7.486 6a.5.5 0 0 1 0 .8l-7.486 6A.5.5 0 0 1 4 14.411z"/></svg>
        </div>
        <div class="min-w-0 flex-1 flex flex-col justify-center">
          <div id="nowTitle" class="font-bold text-[14px] text-slate-800 truncate leading-tight">Tidak diputar</div>
          <div class="flex items-center gap-1 mt-0.5">
            <span id="currentTime" class="text-[11px] font-medium text-blue-600">00:00</span>
            <span class="text-[11px] text-slate-400">/</span>
            <span id="duration" class="text-[11px] text-slate-500 font-medium">00:00</span>
          </div>
        </div>
      </div>

      <!-- Kontrol Pemutar (Kanan) -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <button id="prevBtn" class="text-slate-500 hover:text-blue-600 active:scale-90 transition-all p-1">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 16 16"><path d="M4 2.5a.5.5 0 0 0-1 0v11a.5.5 0 0 0 1 0V8.707l7.146 4.647A1.2 1.2 0 0 0 13 12.35V3.65a1.2 1.2 0 0 0-1.854-1.004L4 7.293z"/></svg>
        </button>
        <button id="playBtn" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white flex items-center justify-center shadow-lg shadow-blue-600/30 transition-all">
          <svg id="playIcon" class="w-5 h-5 fill-current ml-1" viewBox="0 0 16 16"><path d="M4 2.5A.5.5 0 0 1 4.757 2l7.486 6a.5.5 0 0 1 0 .8l-7.486 6A.5.5 0 0 1 4 14.411z"/></svg>
        </button>
        <button id="nextBtn" class="text-slate-500 hover:text-blue-600 active:scale-90 transition-all p-1">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 16 16"><path d="M12 2.5a.5.5 0 0 1 1 0v11a.5.5 0 0 1-1 0V8.707L4.854 13.354A1.2 1.2 0 0 1 3 12.35V3.65a1.2 1.2 0 0 1 1.854-1.004L12 7.293z"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[11px] font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <audio id="audio" preload="metadata"></audio>

<script>
'use strict';
const DB_NAME = 'LokalPlayDB', DB_VERSION = 1, STORE = 'tracks';
const els = {
  fileInput: document.getElementById('fileInput'),
  importBtn: document.getElementById('importBtn'),
  clearAllBtn: document.getElementById('clearAllBtn'),
  playlist: document.getElementById('playlist'),
  emptyState: document.getElementById('emptyState'),
  nowTitle: document.getElementById('nowTitle'),
  currentTime: document.getElementById('currentTime'),
  duration: document.getElementById('duration'),
  seek: document.getElementById('seek'),
  progressFill: document.getElementById('progressFill'),
  prevBtn: document.getElementById('prevBtn'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  nextBtn: document.getElementById('nextBtn'),
  toast: document.getElementById('toast'),
  audio: document.getElementById('audio')
};

let db = null, tracks = [], currentIndex = -1, objectUrl = null, toastTimer = null;

function formatTime(s) {
  if (!Number.isFinite(s) || s < 0) return '00:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function showToast(msg) {
  clearTimeout(toastTimer);
  els.toast.textContent = msg;
  els.toast.classList.remove('opacity-0');
  els.toast.classList.add('opacity-100');
  toastTimer = setTimeout(() => {
    els.toast.classList.remove('opacity-100');
    els.toast.classList.add('opacity-0');
  }, 2500);
}

// Database Setup
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => { e.target.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true }) };
    req.onsuccess = e => { db = e.target.result; res(db) };
    req.onerror = e => rej(e.target.error);
  });
}
function dbGetAll() {
  return new Promise(res => {
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result || []);
  });
}
function dbAdd(track) {
  return new Promise(res => {
    const req = db.transaction(STORE, 'readwrite').objectStore(STORE).add(track);
    req.onsuccess = () => res(req.result);
  });
}
function dbDelete(id) {
  return new Promise(res => {
    const req = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
    req.onsuccess = () => res();
  });
}
function dbClear() {
  return new Promise(res => {
    const req = db.transaction(STORE, 'readwrite').objectStore(STORE).clear();
    req.onsuccess = () => res();
  });
}

async function importFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|m4a|aac|flac|ogg)$/i.test(f.name));
  if (!files.length) { showToast('Format file tidak didukung'); return; }
  
  let added = 0;
  for (const file of files) {
    const track = { 
      name: file.name.replace(/\.[^/.]+$/, ""), // Hapus ekstensi di nama
      type: file.type || 'audio', 
      size: file.size, 
      blob: file 
    };
    const id = await dbAdd(track);
    track.id = id;
    tracks.push(track);
    added++;
  }
  
  renderPlaylist();
  if (currentIndex === -1 && tracks.length) selectTrack(0, true);
  showToast(`${added} lagu ditambahkan`);
}

function renderPlaylist() {
  els.playlist.innerHTML = '';
  
  if (!tracks.length) {
    els.emptyState.classList.remove('hidden');
    return;
  } else {
    els.emptyState.classList.add('hidden');
  }
  
  const frag = document.createDocumentFragment();
  tracks.forEach((track, index) => {
    const isActive = index === currentIndex;
    const li = document.createElement('li');
    
    // Desain Item Playlist yang ramah sentuhan (Touch-friendly)
    li.className = `group flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-blue-50' : 'bg-white hover:bg-slate-50'}`;
    
    li.innerHTML = `
      <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-xs ${isActive ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500 group-hover:bg-slate-200'}">
        ${isActive ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 16 16"><path d="M4 2.5A.5.5 0 0 1 4.757 2l7.486 6a.5.5 0 0 1 0 .8l-7.486 6A.5.5 0 0 1 4 14.411z"/></svg>' : index + 1}
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[13px] truncate ${isActive ? 'text-blue-700' : 'text-slate-700'}">${track.name}</div>
        <div class="text-[11px] text-slate-400 mt-0.5">${(track.size / (1024*1024)).toFixed(1)} MB</div>
      </div>
      <button class="p-2 text-slate-300 hover:text-red-500 rounded-full bg-transparent hover:bg-red-50 transition-colors" title="Hapus">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
      </button>
    `;
    
    // Event listener Hapus
    li.querySelector('button').addEventListener('click', async (e) => { 
      e.stopPropagation(); 
      await removeTrack(index); 
    });
    
    // Event listener Putar
    li.addEventListener('click', () => selectTrack(index, true));
    
    frag.appendChild(li);
  });
  els.playlist.appendChild(frag);
}

async function selectTrack(index, autoplay = false) {
  if (index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const track = tracks[index];
  
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(track.blob);
  
  els.audio.src = objectUrl;
  els.audio.load();
  
  els.nowTitle.textContent = track.name;
  els.progressFill.style.width = '0%';
  els.seek.value = 0;
  
  renderPlaylist();
  if (autoplay) els.audio.play().catch(() => {});
}

async function togglePlay() {
  if (!tracks.length) return;
  if (currentIndex === -1) await selectTrack(0, false);
  if (els.audio.paused) els.audio.play().catch(() => {});
  else els.audio.pause();
}

async function nextTrack() {
  if (!tracks.length) return;
  await selectTrack((currentIndex + 1) % tracks.length, true);
}

async function prevTrack() {
  if (!tracks.length) return;
  await selectTrack(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1, true);
}

async function removeTrack(index) {
  await dbDelete(tracks[index].id);
  tracks.splice(index, 1);
  
  if (!tracks.length) {
    currentIndex = -1;
    els.audio.pause(); els.audio.removeAttribute('src');
    els.nowTitle.textContent = 'Tidak diputar';
    els.currentTime.textContent = '00:00';
    els.duration.textContent = '00:00';
    els.progressFill.style.width = '0%';
    els.seek.value = 0;
  } else if (index === currentIndex) {
    currentIndex = -1;
    await selectTrack(Math.min(index, tracks.length - 1), false);
  } else if (index < currentIndex) {
    currentIndex--;
  }
  renderPlaylist();
}

async function clearAll() {
  if (!tracks.length) return;
  if(!confirm("Yakin ingin mengosongkan playlist?")) return;
  
  await dbClear();
  tracks = []; currentIndex = -1;
  els.audio.pause(); els.audio.removeAttribute('src');
  els.nowTitle.textContent = 'Tidak diputar';
  els.currentTime.textContent = '00:00';
  els.duration.textContent = '00:00';
  els.progressFill.style.width = '0%';
  els.seek.value = 0;
  
  renderPlaylist();
  updatePlayButton();
  showToast('Playlist dikosongkan');
}

function updatePlayButton() {
  const playing = !els.audio.paused && !els.audio.ended && els.audio.readyState > 0;
  
  els.playIcon.innerHTML = playing ? 
    '<path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>' : 
    '<path d="M4 2.5A.5.5 0 0 1 4.757 2l7.486 6a.5.5 0 0 1 0 .8l-7.486 6A.5.5 0 0 1 4 14.411z"/>';
    
  if(playing) els.playIcon.classList.remove('ml-1');
  else els.playIcon.classList.add('ml-1');
}

// Events Listener
els.importBtn.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', async () => { 
  await importFiles(els.fileInput.files); 
  els.fileInput.value = ''; 
});
els.clearAllBtn.addEventListener('click', clearAll);
els.playBtn.addEventListener('click', togglePlay);
els.prevBtn.addEventListener('click', prevTrack);
els.nextBtn.addEventListener('click', nextTrack);

// Update progress bar & time
els.seek.addEventListener('input', () => {
  if (Number.isFinite(els.audio.duration)) {
    els.audio.currentTime = (els.seek.value / 100) * els.audio.duration;
    els.progressFill.style.width = els.seek.value + '%';
  }
});

els.audio.addEventListener('loadedmetadata', () => {
  els.duration.textContent = formatTime(els.audio.duration);
  if(tracks[currentIndex]) tracks[currentIndex].duration = els.audio.duration;
});

els.audio.addEventListener('timeupdate', () => {
  els.currentTime.textContent = formatTime(els.audio.currentTime);
  if (els.audio.duration) {
    const percentage = (els.audio.currentTime / els.audio.duration) * 100;
    els.seek.value = percentage;
    els.progressFill.style.width = percentage + '%';
  }
});

els.audio.addEventListener('play', updatePlayButton);
els.audio.addEventListener('pause', updatePlayButton);
els.audio.addEventListener('ended', nextTrack);

// Boot sequence
async function boot() {
  await openDB();
  tracks = await dbGetAll();
  renderPlaylist();
  if (tracks.length) await selectTrack(0, false);
}
boot();
</script>
</body>
</html>
