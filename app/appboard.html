=st.connections||[];restoreMediaElements();selectedIds.clear();resizeCardId=null;connSourcePin=null;draw();}function redo(){closeEditor();if(!redoSt.length)return;undoSt.push(JSON.stringify({cards:cards,connections:connections}));const st=JSON.parse(redoSt.pop());cards=st.cards;connections=st.connections||[];restoreMediaElements();selectedIds.clear();resizeCardId=null;connSourcePin=null;draw();}function restoreMediaElements(){domMediaMap.forEach(el=>el.remove());domMediaMap.clear();cards.forEach(cd=>{if(cd.type==='media'){if(cd.mediaType==='image'){const img=new Image();img.src=cd.src;cd._img=img;img.onload=()=>draw();}else{createMediaDom(cd);}}});}function copyCard(){clip=cards.filter(c=>selectedIds.has(c.id)).map(c=>JSON.parse(JSON.stringify(c)));}function cutCard(){if(!selectedIds.size)return;closeEditor();sState();copyCard();const delIds=new Set(selectedIds);delIds.forEach(id=>{if(domMediaMap.has(id)){domMediaMap.get(id).remove();domMediaMap.delete(id);}});cards=cards.filter(c=>!delIds.has(c.id));connections=connections.filter(cn=>!delIds.has(cn.fromId)&&!delIds.has(cn.toId));if(resizeCardId&&delIds.has(resizeCardId))resizeCardId=null;selectedIds.clear();draw();}function pasteCard(){if(!clip.length)return;closeEditor();sState();selectedIds.clear();clip.forEach(c=>{const cd=JSON.parse(JSON.stringify(c));cd.id=Date.now()+Math.random();cd.x+=20;cd.y+=20;if(cd.type==='media'){if(cd.mediaType==='image'){const img=new Image();img.src=cd.src;cd._img=img;img.onload=()=>draw();}else{createMediaDom(cd);}}cards.push(cd);selectedIds.add(cd.id);});draw();}function dupCard(){if(!selectedIds.size)return;copyCard();pasteCard();}function delCard(){if(!selectedIds.size)return;closeEditor();sState();const delIds=new Set(selectedIds);delIds.forEach(id=>{if(domMediaMap.has(id)){domMediaMap.get(id).remove();domMediaMap.delete(id);}});cards=cards.filter(c=>!delIds.has(c.id));connections=connections.filter(cn=>!delIds.has(cn.fromId)&&!delIds.has(cn.toId));if(resizeCardId&&delIds.has(resizeCardId))resizeCardId=null;selectedIds.clear();draw();}function resetOriginSize(){if(!selectedIds.size)return;sState();cards.filter(c=>selectedIds.has(c.id)).forEach(cd=>{cd.w=cd.baseW;cd.h=cd.baseH;cd.scale=1;cd.ratio=cd.baseW/cd.baseH;if(cd.type==='text')updateCardLayout(cd,cd.raw);});draw();}function selectAll(){selectedIds.clear();cards.forEach(c=>selectedIds.add(c.id));draw();}function zoomToFit(){if(!cards.length)return;closeEditor();let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;cards.forEach(c=>{minX=Math.min(minX,c.x);minY=Math.min(minY,c.y);maxX=Math.max(maxX,c.x+c.w);maxY=Math.max(maxY,c.y+c.h);});const bw=maxX-minX,bh=maxY-minY,pad=60,availW=w-20-pad*2,availH=h-20-pad*2;let ns=Math.min(availW/bw,availH/bh);ns=Math.min(4,Math.max(0.1,ns));s=ns;ox=20+pad+(availW-bw*s)/2-minX*s;oy=20+pad+(availH-bh*s)/2-minY*s;updateCoord();draw();}function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;if(!init){ox=0;oy=0;curX=0;curY=0;init=true;}updateCoord();if(editingCard)syncEditorPos();draw();}function updateCoord(){const wx=Math.round((curX-ox)/s),wy=Math.round((curY-oy)/s);coord.textContent=`X: ${wx}, Y: ${wy}`;}function updateSelInfo(){selInfo.textContent=`Terpilih: ${selectedIds.size} / ${cards.length}`;}function applyZoom(f,mx,my){const ns=Math.min(4,Math.max(0.1,s*f));const actF=ns/s;ox=mx-(mx-ox)*actF;oy=my-(my-oy)*actF;s=ns;updateCoord();if(editingCard)syncEditorPos();draw();}function wrapText(txt,maxW,fontSize){const paras=txt.split('\n'),lines=[];x.font=`${fontSize||14}px sans-serif`;for(const p of paras){if(!p){lines.push('');continue;}const words=p.split(' ');let cl='';for(let i=0;i<words.length;i++){const wrd=words[i],test=cl?cl+' '+wrd:wrd;if(x.measureText(test).width<=maxW){cl=test;}else{if(x.measureText(wrd).width>maxW){if(cl){lines.push(cl);cl='';}for(let ch of wrd){if(x.measureText(cl+ch).width<=maxW){cl+=ch;}else{lines.push(cl);cl=ch;}}}else{lines.push(cl);cl=wrd;}}}if(cl)lines.push(cl);}return lines;}function update
