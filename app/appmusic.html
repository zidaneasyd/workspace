<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <style>
        html, body {
            overscroll-behavior-y: none; /* Mencegah pull-to-refresh & pantulan halaman */
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .player-frame {
            width: 100vw;
            height: 100dvh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        @media (min-width: 641px) {
            .player-frame {
                width: 100%;
                max-width: 380px;
                height: 90vh;
                max-height: 800px;
                border: 1px solid rgba(59, 130, 246, 0.28);
                border-radius: 1.5rem;
                box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.08), 0 2px 8px -2px rgba(0, 0, 0, 0.03);
            }
        }

        .seek-track {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: #e2e8f0;
            outline: none;
            cursor: pointer;
            transition: height 0.15s ease;
        }
        .seek-track:hover { height: 3px; }
        .seek-track::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .seek-track:hover::-webkit-slider-thumb { transform: scale(1.3); }

        .playlist-scroll::-webkit-scrollbar { width: 3px; }
        .playlist-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(59, 130, 246, 0.25);
            border-radius: 4px;
        }

        .lyrics-panel { transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth transition for preview lyrics */
        .preview-lyric-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Animation for active control buttons */
        .control-btn-active {
            color: #2563eb;
            position: relative;
        }
        .control-btn-active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #2563eb;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-50 fixed inset-0 m-0 p-0 flex items-center justify-center font-sans antialiased text-slate-800 select-none">

    <main id="playerCard" class="player-frame bg-white flex flex-col relative shadow-2xl overflow-hidden">
        
        <audio id="nativeAudio" preload="metadata"></audio>
        <input type="file" id="filePickerInput" accept="audio/*" multiple class="hidden" />

        <!-- Toast Notification -->
        <div id="toastMessage" class="absolute top-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-[11px] font-medium px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-[100]">
            Notifikasi
        </div>

        <!-- Overlay Drag & Drop -->
        <div id="dragDropOverlay" class="absolute inset-0 bg-blue-600/90 backdrop-blur-sm z-[70] flex flex-col items-center justify-center text-white pointer-events-none opacity-0 transition-opacity duration-200">
            <svg class="w-8 h-8 mb-2 animate-bounce stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V3m0 0l-4 4m4-4l4 4M4.5 19.5h15" />
            </svg>
            <p class="text-xs font-medium tracking-wide">Lepaskan file audio atau file lirik (.lrc)</p>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-[60] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="relative w-20 h-20 mb-3">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#e2e8f0" stroke-width="6"></circle>
                    <circle id="loadingProgressCircle" cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" class="transition-all duration-200 ease-out"></circle>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="loadingText" class="text-sm font-bold text-blue-600">0%</span>
                </div>
            </div>
            <p class="text-xs font-semibold text-slate-600 tracking-wide uppercase">Mengimpor Musik</p>
        </div>

        <!-- Empty State -->
        <div id="emptyStateView" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-white w-full h-full">
            <div id="emptyTriggerBtn" class="w-20 h-20 rounded-full border border-dashed border-blue-300 flex items-center justify-center text-blue-500 hover:border-blue-500 hover:bg-blue-50/50 transition cursor-pointer mb-4">
                <svg class="w-7 h-7 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <p class="text-xs font-semibold text-slate-700">Daftar Putar Kosong</p>
            <p class="text-[11px] text-slate-400 mt-1 max-w-[200px] leading-relaxed">
                Tarik & lepas file audio ke layar atau klik tombol di atas.
            </p>
        </div>

        <!-- Album Cover -->
        <div id="albumCoverContainer" class="relative w-full flex-1 min-h-0 bg-slate-50 hidden shadow-sm z-10 overflow-hidden select-none touch-none">
            <img id="albumCover" src="" alt="Album Cover" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 pointer-events-none" />
            <!-- Gradient Overlay for better contrast with playlist button -->
            <div class="absolute top-0 left-0 right-0 h-16 bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
            
            <button id="btnOpenPlaylist" class="absolute top-4 right-4 p-2 text-slate-700 hover:text-blue-600 transition active:scale-95 z-10 bg-white/80 backdrop-blur-md rounded-full shadow-md">
                <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round" />
                    <line x1="3" y1="12" x2="16" y2="12" stroke-linecap="round" />
                    <line x1="3" y1="18" x2="11" y2="18" stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <!-- Controls -->
        <div id="playerControlsContainer" class="w-full flex flex-col justify-end flex-none relative z-30 bg-white hidden">
            
            <!-- Track Info & Controls -->
            <div class="flex flex-col gap-2 px-6 pt-4 pb-2">
                <!-- Track Info -->
                <div class="text-center overflow-hidden">
                    <h1 id="songTitle" class="text-sm font-bold text-slate-800 tracking-tight truncate cursor-pointer hover:text-blue-600 transition">
                        Belum Memutar Lagu
                    </h1>
                    <p id="artistName" class="text-xs text-slate-500 font-medium truncate mt-0.5">
                        Silakan impor lagu
                    </p>
                </div>

                <!-- Seekbar -->
                <div class="w-full mt-3">
                    <input id="seekBar" type="range" min="0" max="100" value="0" class="seek-track" />
                    <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5 font-mono tracking-wider font-medium">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <!-- Playback Buttons (Added Shuffle & Repeat) -->
                <div class="flex items-center justify-between px-2 mt-2">
                    <!-- Shuffle Button -->
                    <button id="btnShuffle" class="p-2 text-slate-400 hover:text-slate-800 transition active:scale-90 relative">
                        <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                    </button>

                    <div class="flex items-center gap-4">
                        <button id="btnPrev" class="p-2 text-slate-500 hover:text-slate-800 transition active:scale-90">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                            </svg>
                        </button>
                        
                        <button id="btnPlayPause" class="w-12 h-12 bg-blue-600 rounded-full text-white hover:bg-blue-700 hover:scale-105 transition-all shadow-md shadow-blue-600/30 flex items-center justify-center active:scale-95">
                            <svg id="playIconSvg" class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                        </button>
                        
                        <button id="btnNext" class="p-2 text-slate-500 hover:text-slate-800 transition active:scale-90">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Repeat Button -->
                    <button id="btnRepeat" class="p-2 text-slate-400 hover:text-slate-800 transition active:scale-90 relative">
                        <svg id="repeatIconSvg" class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Taller Lyrics Handle with Multi-line Preview -->
            <div id="btnOpenLyrics" class="w-full h-32 mt-auto bg-slate-50/50 border-t border-x border-slate-200/60 rounded-t-3xl flex flex-col items-center justify-start pt-3 cursor-pointer hover:bg-slate-100/50 transition-colors shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.05)] group z-30 relative overflow-hidden">
                
                <!-- Drag Handle Bar -->
                <div class="w-10 h-1 bg-slate-300 rounded-full group-hover:bg-slate-400 transition-colors flex-shrink-0 z-10 mb-2"></div>
                
                <!-- Multi-line Lyrics Container -->
                <div class="w-full px-4 flex-1 flex flex-col justify-center items-center relative mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);">
                    
                    <!-- Top Fade Mask -->
                    <div class="absolute top-0 left-0 right-0 h-4 bg-gradient-to-b from-slate-50/90 to-transparent z-10 pointer-events-none"></div>
                    
                    <div id="previewLyricsWrapper" class="flex flex-col w-full text-center items-center justify-center transition-transform duration-300 transform translate-y-0">
                        <!-- Line -1 (Previous) -->
                        <p id="previewPrevLyric" class="text-[10px] text-slate-400 font-medium truncate w-[90%] opacity-0 h-4 leading-4 preview-lyric-item mb-1">
                            
                        </p>
                        
                        <!-- Current Line -->
                        <p id="previewCurrLyric" class="text-[13px] text-slate-700 font-semibold truncate w-full h-6 leading-6 preview-lyric-item text-shadow-sm">
                            Tarik ke atas untuk lirik
                        </p>
                        
                        <!-- Line +1 (Next) -->
                        <p id="previewNextLyric" class="text-[10px] text-slate-400 font-medium truncate w-[90%] opacity-0 h-4 leading-4 preview-lyric-item mt-1">
                            
                        </p>
                    </div>

                    <!-- Bottom Fade Mask -->
                    <div class="absolute bottom-0 left-0 right-0 h-4 bg-gradient-to-t from-slate-50/90 to-transparent z-10 pointer-events-none"></div>
                </div>
            </div>
        </div>

        <!-- Full Lyrics View -->
        <section id="lyricsView" class="absolute bottom-0 left-0 right-0 h-[98%] bg-white/95 backdrop-blur-xl z-50 rounded-t-3xl shadow-2xl border-t border-slate-100 transform translate-y-full lyrics-panel flex flex-col touch-none">
            <div class="flex flex-col items-center pt-3 pb-2 flex-shrink-0 cursor-grab active:cursor-grabbing bg-transparent sticky top-0 z-10" id="lyricsDragHandle">
                <div class="w-10 h-1 bg-slate-300 rounded-full mb-4"></div>
                <div class="flex items-center justify-between w-full px-6">
                    <h2 class="text-[13px] font-bold text-slate-700 tracking-wide">LIRIK LAGU</h2>
                    <button id="btnCloseLyrics" class="p-1.5 text-slate-400 hover:text-slate-800 rounded-full transition">
                        <svg class="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="lyricsContainer" class="flex-1 overflow-y-auto no-scrollbar px-6 text-center text-slate-600 text-sm leading-relaxed scroll-smooth relative pb-10">
                <!-- Lyrics will be injected here -->
            </div>
        </section>

        <!-- Playlist View -->
        <section id="playlistView" class="absolute inset-0 bg-white z-40 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col">
            <div class="px-5 pt-8 pb-4 flex items-center justify-between relative flex-shrink-0 bg-white z-10">
                <button id="btnClosePlaylist" class="p-2 -ml-2 text-slate-400 hover:text-slate-800 transition">
                    <svg class="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
                </button>
                
                <div class="relative">
                    <button id="btnKebabMenu" class="p-2 -mr-2 text-slate-400 hover:text-slate-800 transition active:scale-90">
                        <svg class="w-5 h-5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="5" r="1.5" fill="currentColor" />
                            <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                            <circle cx="12" cy="19" r="1.5" fill="currentColor" />
                        </svg>
                    </button>
                    <!-- Kebab Menu Dropdown -->
                    <div id="kebabDropdown" class="absolute right-0 top-10 w-40 bg-white border border-slate-100 shadow-xl rounded-xl py-1.5 text-xs text-slate-700 hidden z-[60] origin-top-right transition-all">
                        <button id="menuAddFiles" class="w-full text-left px-4 py-2.5 hover:bg-blue-50 hover:text-blue-600 transition flex items-center gap-2">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            Impor Lagu
                        </button>
                        <div class="border-t border-slate-100 my-1"></div>
                        <button id="menuClearAll" class="w-full text-left px-4 py-2.5 hover:bg-rose-50 hover:text-rose-600 transition flex items-center gap-2">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            Kosongkan
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="playlistContainer" class="flex-1 overflow-y-auto playlist-scroll px-5 pb-6 bg-white">
                <!-- Playlist Items will be injected here -->
            </div>
        </section>

    </main>

    <script>
        const DEFAULT_COVER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
                <rect width="400" height="400" fill="#f8fafc"/>
                <!-- Geometric pattern background -->
                <path d="M0 0h400v400H0z" fill="url(#pattern)"/>
                <circle cx="200" cy="200" r="100" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/>
                <circle cx="200" cy="200" r="30" fill="#3b82f6"/>
                <path d="M190 170v60l45-30-45-30z" fill="#ffffff" transform="translate(7,0)"/>
                <defs>
                    <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M0 40L40 0H20L0 20M40 40V20L20 40" fill="#f1f5f9" stroke="none"/>
                    </pattern>
                </defs>
            </svg>
        `);

        // State Variables
        let playlist = [];
        let shuffledPlaylist = []; // Stores indices of original playlist for shuffling
        let currentTrackIndex = 0; // Always refers to index in the main 'playlist' array
        let isPlaying = false;
        let currentSyncLineIndex = -1;
        
        // IndexedDB Variables
        const DB_NAME = 'MinimalMusicPlayerDB';
        const STORE_NAME = 'tracks';
        let db;

        // Playback Modes
        let isShuffleOn = false;
        // Repeat mode: 0 = Off, 1 = Repeat All, 2 = Repeat One
        let repeatMode = 0; 

        // DOM Elements
        const nativeAudio = document.getElementById('nativeAudio');
        const filePickerInput = document.getElementById('filePickerInput');
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingProgressCircle = document.getElementById('loadingProgressCircle');
        const loadingText = document.getElementById('loadingText');
        
        const dragDropOverlay = document.getElementById('dragDropOverlay');
        const emptyStateView = document.getElementById('emptyStateView');
        const albumCoverContainer = document.getElementById('albumCoverContainer');
        const playerControlsContainer = document.getElementById('playerControlsContainer');
        const emptyTriggerBtn = document.getElementById('emptyTriggerBtn');
        const albumCover = document.getElementById('albumCover');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');

        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        // Buttons
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIconSvg = document.getElementById('playIconSvg');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnShuffle = document.getElementById('btnShuffle');
        const btnRepeat = document.getElementById('btnRepeat');
        const repeatIconSvg = document.getElementById('repeatIconSvg');

        // Views
        const playlistView = document.getElementById('playlistView');
        const playlistContainer = document.getElementById('playlistContainer');

        const lyricsView = document.getElementById('lyricsView');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const kebabDropdown = document.getElementById('kebabDropdown');
        
        // Preview Lyrics DOM
        const previewPrevLyric = document.getElementById('previewPrevLyric');
        const previewCurrLyric = document.getElementById('previewCurrLyric');
        const previewNextLyric = document.getElementById('previewNextLyric');

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function updateShuffleList() {
            if (playlist.length === 0) return;
            shuffledPlaylist = Array.from({length: playlist.length}, (_, i) => i);
            if (isShuffleOn) {
                // Remove current track from array to be shuffled
                shuffledPlaylist = shuffledPlaylist.filter(i => i !== currentTrackIndex);
                // Shuffle the rest
                shuffleArray(shuffledPlaylist);
                // Put current track at the beginning so we don't play it again immediately on Next
                shuffledPlaylist.unshift(currentTrackIndex);
            }
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            if (isPlaying) {
                // Pause icon
                playIconSvg.innerHTML = `<rect x="7" y="5" width="3" height="14" rx="1"></rect><rect x="14" y="5" width="3" height="14" rx="1"></rect>`;
                playIconSvg.classList.remove('ml-0.5'); // Remove offset needed for play triangle
            } else {
                // Play icon
                playIconSvg.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
                playIconSvg.classList.add('ml-0.5');
            }
        }

        function updatePlaybackButtonsUI() {
            // Shuffle
            if (isShuffleOn) {
                btnShuffle.classList.add('control-btn-active', 'text-blue-600');
                btnShuffle.classList.remove('text-slate-400');
            } else {
                btnShuffle.classList.remove('control-btn-active', 'text-blue-600');
                btnShuffle.classList.add('text-slate-400');
            }

            // Repeat
            btnRepeat.classList.remove('control-btn-active', 'text-blue-600');
            btnRepeat.classList.add('text-slate-400');
            
            if (repeatMode === 0) {
                // Off
                repeatIconSvg.innerHTML = `
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                `;
            } else if (repeatMode === 1) {
                // Repeat All
                btnRepeat.classList.add('control-btn-active', 'text-blue-600');
                btnRepeat.classList.remove('text-slate-400');
                repeatIconSvg.innerHTML = `
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                `;
            } else if (repeatMode === 2) {
                // Repeat One
                btnRepeat.classList.add('control-btn-active', 'text-blue-600');
                btnRepeat.classList.remove('text-slate-400');
                repeatIconSvg.innerHTML = `
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    <text x="12" y="16" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">1</text>
                `;
            }
        }

        function parseLrc(lrcText) {
            const lines = lrcText.split(/\r?\n/);
            const syncLyrics = [];
            const timeRegex = /\[(\d{2,}):(\d{2})(?:\.(\d{1,3}))?\]/g; 

            lines.forEach(line => {
                let match;
                const matches = [];
                while ((match = timeRegex.exec(line)) !== null) {
                    matches.push(match);
                }
                
                if (matches.length > 0) {
                    const text = line.replace(/\[\d{2,}:\d{2}(?:\.\d{1,3})?\]/g, '').trim();
                    matches.forEach(m => {
                        const minutes = parseInt(m[1], 10);
                        const seconds = parseInt(m[2], 10);
                        let msStr = m[3] || "0";
                        let ms = parseInt(msStr, 10);
                        if (msStr.length === 1) ms *= 100;
                        else if (msStr.length === 2) ms *= 10;
                        
                        syncLyrics.push({ time: minutes * 60 + seconds + ms / 1000, text });
                    });
                }
            });
            return syncLyrics.sort((a, b) => a.time - b.time);
        }

        function applyLrcFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const parsed = parseLrc(text);
                
                playlist[currentTrackIndex].lyrics = text; 
                playlist[currentTrackIndex].syncLyrics = parsed.length > 0 ? parsed : null;
                
                // Perbarui lagu di IndexedDB
                if (db) {
                    const trackToUpdate = { ...playlist[currentTrackIndex] };
                    delete trackToUpdate.src; // URL Object bersifat sementara, jangan disimpan di DB
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put(trackToUpdate);
                }

                updateLyricsDisplay(playlist[currentTrackIndex]);
                showToast("Lirik berhasil diimpor!");
                openLyrics();
            };
            reader.readAsText(file);
        }

                    <div class="flex flex-col items-center justify-center h-full text-slate-500 py-20 mt-10">
                        <svg class="w-12 h-12 mb-4 stroke-current fill-none opacity-30" viewBox="0 0 24 24" stroke-width="1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                        </svg>
                        <p class="text-[15px] font-semibold text-slate-600">Lirik Belum Tersedia</p>

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function updateEmptyState() {
            if (playlist.length === 0) {
                emptyStateView.classList.remove('hidden');
                albumCoverContainer.classList.add('hidden');
                playerControlsContainer.classList.add('hidden');
                
                albumCover.src = DEFAULT_COVER_SVG;
                songTitle.textContent = "Belum Memutar Lagu";
                artistName.textContent = "Silakan impor lagu";
                currentTimeEl.textContent = "00:00";
                durationTimeEl.textContent = "00:00";

                nativeAudio.pause();
                nativeAudio.src = "";
                setPlayingState(false);

                // Reset preview text
                previewPrevLyric.classList.add('opacity-0');
                previewCurrLyric.textContent = "Tarik ke atas untuk lirik";

                emptyStateView.classList.add('hidden');
                albumCoverContainer.classList.remove('hidden');
                playerControlsContainer.classList.remove('hidden');

        function loadTrack(index, autoplay = false) {
            if (playlist.length === 0) {
                updateEmptyState();
                renderPlaylist();
                return;
            }

            // Ensure index is valid
            currentTrackIndex = Math.max(0, Math.min(index, playlist.length - 1));
            const track = playlist[currentTrackIndex];
            
            updateEmptyState();

            songTitle.textContent = track.title;
            artistName.textContent = track.artist;
            albumCover.src = track.cover || DEFAULT_COVER_SVG;
            
            // Add subtle fade animation to cover
            albumCover.style.opacity = '0.5';
            setTimeout(() => albumCover.style.opacity = '1', 50);

            updateLyricsDisplay(track);

            nativeAudio.src = track.src;
            nativeAudio.load();
            renderPlaylist();

            if (autoplay) playAudio();
            else setPlayingState(false);
        }

        function playAudio() {
            if (playlist.length === 0) return;
            nativeAudio.play().then(() => setPlayingState(true)).catch(e => {
                console.error("Playback failed:", e);
                setPlayingState(false);
            });
        }

        function pauseAudio() {
            nativeAudio.pause();
            setPlayingState(false);
        }

        // Modified logic for Shuffle & Repeat
        function getNextTrackIndex() {
            if (playlist.length <= 1) return currentTrackIndex;

            if (isShuffleOn) {
                // Find current position in shuffled list
                let posInShuffle = shuffledPlaylist.indexOf(currentTrackIndex);
                if (posInShuffle === -1) {
                    // Fallback if something went wrong
                    updateShuffleList();
                    posInShuffle = 0;
                }
                
                let nextPos = posInShuffle + 1;
                
                // If reached end of shuffled list
                if (nextPos >= shuffledPlaylist.length) {
                    if (repeatMode === 1) { // Repeat All
                        updateShuffleList(); // Reshuffle for next round
                        return shuffledPlaylist[0];
                    } else { // Repeat Off, stop playing
                        return -1; 
                    }
                }
                return shuffledPlaylist[nextPos];
            } else {
                // Normal sequential play
                if (currentTrackIndex >= playlist.length - 1) {
                    if (repeatMode === 1) {
                        return 0; // Loop back to start
                    } else {
                        return -1; // End of playlist
                    }
                }
                return currentTrackIndex + 1;
            }
        }

        function getPrevTrackIndex() {
            if (playlist.length <= 1) return currentTrackIndex;

            if (isShuffleOn) {
                 let posInShuffle = shuffledPlaylist.indexOf(currentTrackIndex);
                 if (posInShuffle <= 0) {
                     return shuffledPlaylist[shuffledPlaylist.length - 1]; // Go to last in shuffle
                 }
                 return shuffledPlaylist[posInShuffle - 1];
            } else {
                if (currentTrackIndex <= 0) {
                    return playlist.length - 1; // Wrap around to end
                }
                return currentTrackIndex - 1;
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            
            // If Repeat One is on, next track button still goes to next song, 
            // but natural end of song will repeat it.
            
            const nextIdx = getNextTrackIndex();
            if (nextIdx !== -1) {
                loadTrack(nextIdx, true);
            } else {
                // End of playlist and repeat is off
                pauseAudio();
                nativeAudio.currentTime = 0;
                // Optional: go back to first track without playing
                // loadTrack(0, false); 
            }
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            
            // If playing more than 3 seconds, restart current track
            if (nativeAudio.currentTime > 3) {
                nativeAudio.currentTime = 0;
                if (!isPlaying) playAudio();
            } else {
                loadTrack(getPrevTrackIndex(), true);
            }
        }

        function extractTrackMetadata(file) {
            return new Promise((resolve) => {
                let title = file.name.replace(/\.[^/.]+$/, ""), artist = "Unknown Artist", coverUrl = DEFAULT_COVER_SVG, lyrics = null;
                if (title.includes('-')) {
                    const parts = title.split('-');
                    artist = parts[0].trim(); title = parts.slice(1).join('-').trim();
                }

                if (window.jsmediatags) {
                    window.jsmediatags.read(file, {
                        onSuccess: (tag) => {
                            if (tag.tags.title) title = tag.tags.title.trim();
                            if (tag.tags.artist) artist = tag.tags.artist.trim();
                            if (tag.tags.lyrics?.text) lyrics = tag.tags.lyrics.text;
                            else if (tag.tags.uslt?.text) lyrics = tag.tags.uslt.text;

                            if (tag.tags.picture) {
                                let base64String = "";
                                for (let i = 0; i < tag.tags.picture.data.length; i++) base64String += String.fromCharCode(tag.tags.picture.data[i]);
                                coverUrl = `data:${tag.tags.picture.format};base64,${window.btoa(base64String)}`;
                            }
                            resolve({ title, artist, coverUrl, lyrics });
                        },
                        onError: () => resolve({ title, artist, coverUrl, lyrics })
                    });
                } else resolve({ title, artist, coverUrl, lyrics });
            });
        }

        function getAudioDuration(url) {
            return new Promise((resolve) => {
                const tempAudio = new Audio();
                tempAudio.preload = 'metadata';
                tempAudio.src = url;
                tempAudio.onloadedmetadata = () => resolve(formatTime(tempAudio.duration));
                tempAudio.onerror = () => resolve('00:00');
            });
        }

        async function processFiles(audioFiles) {
            if (audioFiles.length === 0) return;
            const wasEmpty = playlist.length === 0;
            const total = audioFiles.length;
            const circumference = 2 * Math.PI * 45;
            
            loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            loadingOverlay.classList.add('opacity-100', 'pointer-events-auto');

            for (let i = 0; i < total; i++) {
                const file = audioFiles[i];
                const url = URL.createObjectURL(file);
                const metadata = await extractTrackMetadata(file);
                const duration = await getAudioDuration(url);

                let syncLyrics = null;
                if (metadata.lyrics) {
                    const parsed = parseLrc(metadata.lyrics);
                    if (parsed.length > 0) syncLyrics = parsed;
                }

                const trackData = {
                    id: Date.now() + i + Math.random(), // Generate ID unik untuk IndexedDB
                    file: file,
                    title: metadata.title, 
                    artist: metadata.artist, 
                    cover: metadata.coverUrl, 
                    lyrics: metadata.lyrics, 
                    syncLyrics: syncLyrics, 
                    duration: duration
                };

                // Simpan ke IndexedDB
                if (db) {
                    await new Promise(resolve => {
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        tx.objectStore(STORE_NAME).put(trackData);
                        tx.oncomplete = resolve;
                    });
                }

                playlist.push({
                    ...trackData,
                    src: url // URL aktif untuk dimainkan
                });

                const percent = Math.round(((i + 1) / total) * 100);
                loadingText.textContent = `${percent}%`;
                loadingProgressCircle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
            }
            
            // Update shuffle list with new additions
            updateShuffleList();
            renderPlaylist();

            setTimeout(() => {
                loadingOverlay.classList.remove('opacity-100', 'pointer-events-auto');
                loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                setTimeout(() => {
                    loadingText.textContent = `0%`;
                    loadingProgressCircle.style.strokeDashoffset = circumference;
                }, 300);
            }, 400);

            if (wasEmpty && playlist.length > 0) {
                loadTrack(0, true);
            } else {
                showToast(`${total} lagu ditambahkan`);
            }
        }

        let dragCounter = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault(); dragCounter++;
            dragDropOverlay.classList.remove('opacity-0'); dragDropOverlay.classList.add('opacity-100');
        });
        window.addEventListener('dragleave', (e) => {
            e.preventDefault(); dragCounter--;
            if (dragCounter <= 0) { dragCounter = 0; dragDropOverlay.classList.remove('opacity-100'); dragDropOverlay.classList.add('opacity-0'); }
        });
        window.addEventListener('dragover', (e) => e.preventDefault());
        
        window.addEventListener('drop', (e) => {
            e.preventDefault(); dragCounter = 0;
            dragDropOverlay.classList.remove('opacity-100'); dragDropOverlay.classList.add('opacity-0');

            if (e.dataTransfer && e.dataTransfer.files) {
                const files = Array.from(e.dataTransfer.files);
                
                const lrcFiles = files.filter(f => f.name.toLowerCase().endsWith('.lrc') || f.name.toLowerCase().endsWith('.txt'));
                const audioFiles = files.filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name));

                if (lrcFiles.length > 0) {
                    if (playlist.length === 0) {
                        showToast("Impor lagu terlebih dahulu sebelum menambahkan lirik.");
                    } else {
                        applyLrcFile(lrcFiles[0]);
                    }
                }

                if (audioFiles.length > 0) processFiles(audioFiles);
            }
        });

        function renderPlaylist() {

            if (playlist.length === 0) {
                playlistContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 py-10">
                        <p class="text-sm font-medium">Daftar putar kosong</p>

            playlist.forEach((track, idx) => {

                row.innerHTML = `
                    <img src="${track.cover || DEFAULT_COVER_SVG}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0 bg-slate-100 border border-slate-200/40" />

                row.onclick = () => {

                playlistContainer.appendChild(row);

        }

        document.getElementById('emptyTriggerBtn').onclick = () => filePickerInput.click();
        
        // Menu Actions
        document.getElementById('menuAddFiles').onclick = () => { kebabDropdown.classList.add('hidden'); filePickerInput.click(); };
        filePickerInput.onchange = (e) => { if (e.target.files) { processFiles(Array.from(e.target.files)); filePickerInput.value = ''; } };
        
        document.getElementById('menuClearAll').onclick = async () => { 
            kebabDropdown.classList.add('hidden'); 
            
            // Hapus cache memori object URLs
            playlist.forEach(track => {
                if(track.src) URL.revokeObjectURL(track.src);
            });
            
            playlist = []; 
            shuffledPlaylist = [];
            
            // Kosongkan IndexedDB
            if (db) {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).clear();
            }

            updateEmptyState(); 
            renderPlaylist();
            closePlaylist();
            showToast("Daftar putar dikosongkan"); 
        };
        
        // Control Actions

            isPlaying ? pauseAudio() : playAudio();
        };
        btnPrev.onclick = prevTrack; 
        btnNext.onclick = nextTrack;
        
        // Toggle Shuffle
        btnShuffle.onclick = () => {
            isShuffleOn = !isShuffleOn;
            updateShuffleList();
            updatePlaybackButtonsUI();
            showToast(isShuffleOn ? "Acak Nyala" : "Acak Mati");
        };

        // Toggle Repeat (Off -> All -> One -> Off)
        btnRepeat.onclick = () => {
            repeatMode = (repeatMode + 1) % 3;
            updatePlaybackButtonsUI();
            const msgs = ["Ulangi Mati", "Ulangi Semua", "Ulangi Satu Lagu"];
            showToast(msgs[repeatMode]);
        };

        // On Track End
        nativeAudio.onended = () => {
            if (repeatMode === 2) { // Repeat One
                nativeAudio.currentTime = 0;
                playAudio();
            } else {
                nextTrack();
            }
        };

        // Time Update Handler (Syncing lyrics & seekbar)
        nativeAudio.ontimeupdate = () => {
            if (!nativeAudio.duration) return;
            const current = nativeAudio.currentTime;
            currentTimeEl.textContent = formatTime(current);
            durationTimeEl.textContent = formatTime(nativeAudio.duration);
            seekBar.value = (current / nativeAudio.duration) * 100;

            if (playlist[currentTrackIndex]?.syncLyrics) {
                const syncLyrics = playlist[currentTrackIndex].syncLyrics;
                let activeIdx = -1;
                for (let i = 0; i < syncLyrics.length; i++) {
                    if (current >= syncLyrics[i].time) activeIdx = i;
                    else break;
                }

                if (activeIdx !== -1 && activeIdx !== currentSyncLineIndex) {
                    currentSyncLineIndex = activeIdx;
                    
                    // UPDATE MULTI-LINE PREVIEW LYRIC TEXT
                    const currText = syncLyrics[activeIdx].text || '♪';
                    const prevText = activeIdx > 0 ? (syncLyrics[activeIdx-1].text || '') : '';
                    const nextText = activeIdx < syncLyrics.length - 1 ? (syncLyrics[activeIdx+1].text || '') : '';

                    // Animate transition slightly
                    const wrapper = document.getElementById('previewLyricsWrapper');
                    wrapper.style.transform = 'translateY(-4px)';
                    
                    setTimeout(() => {
                        // Current Line
                        previewCurrLyric.textContent = currText;
                        previewCurrLyric.className = "text-[13px] text-blue-600 font-bold truncate w-full h-6 leading-6 preview-lyric-item";
                        
                        // Previous Line
                        if (prevText) {
                            previewPrevLyric.textContent = prevText;
                            previewPrevLyric.classList.remove('opacity-0');
                            previewPrevLyric.classList.add('opacity-100');
                        } else {
                            previewPrevLyric.classList.remove('opacity-100');
                            previewPrevLyric.classList.add('opacity-0');
                        }

                        // Next Line
                        if (nextText) {
                            previewNextLyric.textContent = nextText;
                            previewNextLyric.classList.remove('opacity-0');
                            previewNextLyric.classList.add('opacity-100');
                        } else {
                            previewNextLyric.classList.remove('opacity-100');
                            previewNextLyric.classList.add('opacity-0');
                        }
                        
                        wrapper.style.transform = 'translateY(0px)';
                    }, 150);


                    // UPDATE FULL LYRICS PANEL
                    const listItems = document.querySelectorAll('.lyric-line');
                    listItems.forEach((li, idx) => {
                        if (idx === activeIdx) {
                            li.classList.add('text-blue-600', 'scale-[1.15]', 'opacity-100', 'font-bold');
                            li.classList.remove('text-slate-400', 'opacity-60', 'scale-100', 'font-medium');
                            // Scroll to active line
                            const scrollPos = li.offsetTop - (lyricsContainer.clientHeight / 2) + (li.clientHeight / 2);
                            lyricsContainer.scrollTo({ top: scrollPos, behavior: 'smooth' });
                        } else {
                            li.classList.remove('text-blue-600', 'scale-[1.15]', 'opacity-100', 'font-bold');
                            li.classList.add('text-slate-400', 'opacity-60', 'scale-100', 'font-medium');
                        }
                    });
                }
            }
        };

        seekBar.oninput = (e) => { if (nativeAudio.duration) nativeAudio.currentTime = (e.target.value / 100) * nativeAudio.duration; };

        // View Toggles

            playlistView.classList.remove('translate-y-full');

        };
        const closePlaylist = () => {

            kebabDropdown.classList.add('hidden'); 
        };
        
        document.getElementById('btnOpenPlaylist').onclick = openPlaylist;
        document.getElementById('btnClosePlaylist').onclick = closePlaylist;
        
        const openLyrics = () => { lyricsView.classList.remove('translate-y-full'); lyricsView.style.transform = 'translateY(0px)'; };
        const closeLyrics = () => { lyricsView.classList.add('translate-y-full'); lyricsView.style.transform = ''; };
        
        document.getElementById('btnOpenLyrics').onclick = openLyrics;
        songTitle.onclick = openLyrics;
        document.getElementById('btnCloseLyrics').onclick = closeLyrics;

        // Lyrics Drag Gesture
        const dragHandle = document.getElementById('lyricsDragHandle');
        let startY = 0, isDragging = false;
        
        const onTouchStart = (e) => { isDragging = true; startY = e.touches ? e.touches[0].clientY : e.clientY; lyricsView.style.transition = 'none'; };
        const onTouchMove = (e) => { if (isDragging) { const diff = (e.touches ? e.touches[0].clientY : e.clientY) - startY; if (diff > 0) lyricsView.style.transform = `translateY(${diff}px)`; } };
        const onTouchEnd = (e) => { 
            if (!isDragging) return; isDragging = false;
            lyricsView.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
            const diff = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - startY;
            if (diff > 120) closeLyrics(); else lyricsView.style.transform = 'translateY(0px)';
        };

        dragHandle.addEventListener('touchstart', onTouchStart, {passive: true}); window.addEventListener('touchmove', onTouchMove, {passive: true}); window.addEventListener('touchend', onTouchEnd);
        dragHandle.addEventListener('mousedown', onTouchStart); window.addEventListener('mousemove', onTouchMove); window.addEventListener('mouseup', onTouchEnd);

        // Kebab Menu Logic
        document.getElementById('btnKebabMenu').onclick = (e) => { e.stopPropagation(); kebabDropdown.classList.toggle('hidden'); };
        document.addEventListener('click', (e) => { if (!kebabDropdown.contains(e.target) && !document.getElementById('btnKebabMenu').contains(e.target)) kebabDropdown.classList.add('hidden'); });

        let pressTimer;
        const toggleFullscreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.error(e));
                showToast("Layar Penuh Diaktifkan");
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                showToast("Layar Penuh Dinonaktifkan");
            }
        };
        const startPress = (e) => {
            if(e.type === 'touchstart' && e.touches.length > 1) return; // Abaikan multi-touch
            pressTimer = setTimeout(() => {
                toggleFullscreen();
                if (navigator.vibrate) navigator.vibrate(50); // Getaran kecil sebagai indikasi jika didukung
            }, 600); // Waktu tekan 600ms
        };
        const cancelPress = () => clearTimeout(pressTimer);

        albumCoverContainer.addEventListener('touchstart', startPress, {passive: true});
        albumCoverContainer.addEventListener('touchend', cancelPress);
        albumCoverContainer.addEventListener('touchcancel', cancelPress);
        albumCoverContainer.addEventListener('touchmove', cancelPress, {passive: true}); // Batal jika digeser
        
        albumCoverContainer.addEventListener('mousedown', startPress);
        albumCoverContainer.addEventListener('mouseup', cancelPress);
        albumCoverContainer.addEventListener('mouseleave', cancelPress);

        // Inisialisasi IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = (e) => reject("DB Error");
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        // Init App On Load
        window.addEventListener('DOMContentLoaded', async () => { 
            updatePlaybackButtonsUI();
            
            try {
                // Sambungkan ke DB dan muat lagu yang pernah disimpan
                await initDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                
                request.onsuccess = () => {
                    const storedTracks = request.result;
                    if (storedTracks && storedTracks.length > 0) {
                        storedTracks.forEach(track => {
                            playlist.push({
                                ...track,
                                // Membuat ulang link putar dari file asli saat dimuat
                                src: URL.createObjectURL(track.file) 
                            });
                        });
                        updateShuffleList();
                        renderPlaylist();
                        loadTrack(0, false); // Muat antarmuka tetapi jangan dimainkan otomatis
                    } else {
                        updateEmptyState(); 
                        renderPlaylist(); 
                    }
                };
            } catch (e) {
                console.error("Gagal memuat Database:", e);
                updateEmptyState(); 
                renderPlaylist(); 
            }
        });
    </script>
</body>
</html>
